name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check

      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check
